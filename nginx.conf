server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # The session cookie carries the member's permissions: an Admin role is ~4 KB, split in two cookies, and the sign-in
    # response header overflowed nginx's default 4k proxy buffer (502 "upstream sent too big header", so no session).
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # short links from emails (/s/inv-fa-090-09-2026-k3x9)
    location ~ ^/s/[a-z0-9-]+$ {
        rewrite ^(.*)$ /api$1 break;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # browsers ask for /favicon.ico on their own (pages without a <link>): answer with the one from Settings
    location = /favicon.ico {
        proxy_pass http://api:3000/api/crm/branding/favicon;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
